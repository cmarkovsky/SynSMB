[tool.poetry]
name = "syn-smb"
version = "0.1.0"
description = "Stochastic time series ensemble generation"
authors = ["Cameron Markovsky <cameron.markovsky@utah.edu>"]
license = "MIT"
readme = "README.md"
packages = [{include = "syn_smb", from = "src"}]  # required for src layout

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24"
scipy = "^1.10"
xarray = "^2023.1"
scikit-learn = "^1.3"
statsmodels = "^0.14"
pandas = "^2.0"
netcdf4 = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "*"
ruff = "*"
black = "*"

[tool.poetry.group.viz.dependencies]
matplotlib = "^3.7"
cartopy = "^0.22"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.0"
sphinx-book-theme = "*"
nbsphinx = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"